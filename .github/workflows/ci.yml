name: ParkMyBike CI Pipeline

# Déclenche le pipeline à chaque push ou pull request sur la branche main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupère le code du dépôt GitHub
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Installe Python (version identique à votre conteneur)
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-numeric-version: '3.10'

    # 3. Met en cache les dépendances pour accélérer les futurs lancements
    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # 4. Installe les dépendances nécessaires (dont pytest, requests, sqlalchemy, etc.)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests sqlalchemy psycopg2-binary
        # Si vous avez un fichier requirements.txt, préférez :
        # if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 5. Exécute la suite de tests
    - name: Run Pytest Suite
      run: |
        pytest